[api]
; API anahtariniz. ASLA commit etmeyin (config.ini .gitignore icindedir).
;
; Saglayici secenekleri (OpenAI uyumlu her saglayici calisir):
;
;   Xiaomi MiMo   base_url = https://api.xiaomimimo.com/v1
;                 model    = mimo-v2.6-pro     (MiMo icinde olculen en hizlisi)
;                            mimo-v2.6-flash   (daha ucuz ama olcumde daha yavas)
;                 NOT: oyun ici gecikme icin DeepSeek belirgin sekilde daha hizli
;                      ve daha ongorulebilir -- README "Saglayici gecikmesi" bolumu
;                 anahtar  -> https://platform.xiaomimimo.com
;
;   DeepSeek      base_url = https://api.deepseek.com
;                 model    = deepseek-chat
;                 anahtar  -> https://platform.deepseek.com/api_keys
;
; Hangi modellerin gercekten kullanilabilir oldugunu gormek icin:
;   .venv\Scripts\python.exe check_api.py
key = sk-YOUR_API_KEY_HERE
base_url = https://api.xiaomimimo.com/v1
model = mimo-v2.6-flash
; Cevap suresi siniri (saniye)
timeout = 20
; Dusuk = daha tutarli/sabit cikti (oyun-ici icin onerilir). Kiyas: tests/temp_compare.md
temperature = 0.3
; Chat satiri kisadir; dar tutmak modelin gevezelemesini de engeller.
max_tokens = 256

[translation]
source_lang = Turkish
target_lang = English

[hotkey]
; Cevir + yapistir kisayolu (ornek: f8, f9, ctrl+space, alt+x)
translate = f8
; F8'i oyuna iletme (oyunda F8 bagliysa true birakin)
suppress = true

[behavior]
; Ceviriden sonra otomatik Enter (chat'i gonder). Guvenli olmasi icin false birakin.
auto_send = false
; Cevirisi bitince orijinal pano icerigini geri yukle
restore_clipboard = true
; Sesli geri bildirim (basari/hata bip)
play_sound = true
; Sik kullanilan kisa kaliplari (rotasyon, spike ektim, tek kaldi...) API'ye hic
; gitmeden anlik cevir. 0 ms gecikme, 0 token. Sozluk: callouts.py
use_local_dict = true
; Ayni cumle ikinci kez cevrilirse onbellekten ver (oyun ici comms cok tekrar eder).
cache = true
